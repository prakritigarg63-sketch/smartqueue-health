<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SmartQueue Health helps you track your OPD queue in real time, get notified when your turn is near, and wait anywhere inside the hospital."
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Resolve the theme before first paint so the app never flashes the
      // wrong ground. Mirrors the logic in src/theme/themeContext.ts.
      (function () {
        try {
          var stored = localStorage.getItem('smartqueue-theme')
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute(
            'data-enhanced',
            String(localStorage.getItem('smartqueue-enhanced-contrast') === 'true'),
          )
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', resolved === 'light' ? '#F5F3EB' : '#07100F')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <meta name="theme-color" content="#07100F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SmartQueue Health — Your Turn. Your Time. Anywhere.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
